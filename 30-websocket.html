<script>
const socket = new WebSocket("wss://test.sample.miniapp-service.com:444/websocket");

// Connection opened
socket.addEventListener("open", function (event) {
  document.write('Websocket Connected');
  socket.send("Hello Server! - 0 second");
  let i = 0;
  setInterval(function () {
    i += 1;
    socket.send("Hello Server! - " + 7 * i + " second");
  }, 7000)
});

// Listen for messages
socket.addEventListener("message", function (event) {
  alert("Message from server is '" + event.data + "'");
});
</script>
