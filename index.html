<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示例</title>
</head>
<body>
    <input id="fileInput" type="file" multiple>
    <button onclick="uploadFiles()">上传多文件</button>

    <script>
        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('请选择至少一个文件！');
                return;
            }

            const formData = new FormData();
            for (const file of files) {
                formData.append('data', file);
            }

            try {
                const response = await fetch('https://unidemo.dcloud.net.cn/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    alert('文件上传成功！');
                } else {
                    alert('文件上传失败，请重试。');
                }
            } catch (error) {
                console.error('上传出错：', error);
            }
        }
    </script>
    <div id="list"></div>
    <script>
        const listMap = {
            "获取用户麦克风摄像头": () => {
                navigator.mediaDevices.getUserMedia({ audio: true, video: true }).catch(e => console.log(e));
            }
        };
        Object.keys(listMap).map((key) => {
            const btn = document.createElement("button");
            btn.innerText = key;
            btn.onclick = listMap[key];
            document.getElementById("list").appendChild(btn)
        })
    </script>
</body>
</html>
