<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理位置参数配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 90%;
            max-width: 800px;
            overflow: hidden;
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        h1:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #1a2a6c, #fdbb2d);
            border-radius: 2px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-top: 15px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .card-title {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: #1a2a6c;
            font-size: 1.4rem;
        }
        
        .card-title i {
            margin-right: 10px;
            font-size: 1.6rem;
        }
        
        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .input-container {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        input[type="number"], input[type="checkbox"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input[type="number"]:focus, input[type="checkbox"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            outline: none;
        }
        
        input[type="number"] {
            background: #f8f9fa;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .checkbox-container input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        
        .btn {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(26, 42, 108, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(26, 42, 108, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .result-container {
            background: #2c3e50;
            color: white;
            border-radius: 15px;
            padding: 25px;
            font-family: monospace;
            min-height: 200px;
            overflow: auto;
            position: relative;
        }
        
        .result-title {
            color: #fdbb2d;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
        }
        
        .result-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .error {
            color: #e74c3c;
        }
        
        .success {
            color: #2ecc71;
        }
        
        .info {
            color: #3498db;
        }
        
        .explanation {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #3498db;
        }
        
        .explanation h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .param-info {
            margin-bottom: 15px;
        }
        
        .param-info h4 {
            color: #1a2a6c;
            margin-bottom: 5px;
        }
        
        .param-info p {
            color: #7f8c8d;
            line-height: 1.5;
        }
        
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            font-weight: 500;
        }
        
        .loading {
            color: #3498db;
            display: none;
        }
        
        .location-icon {
            display: inline-block;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .form-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="location-icon">📍</span> 地理位置参数配置</h1>
            <p class="subtitle">自定义地理定位API参数并获取您的位置信息</p>
        </header>
        
        <div class="card">
            <div class="card-title">⚙️ 参数配置</div>
            
            <div class="form-group">
                <div class="input-container">
                    <label for="enableHighAccuracy">高精度模式 (enableHighAccuracy)</label>
                    <div class="checkbox-container">
                        <input type="checkbox" id="enableHighAccuracy" checked>
                        <span>启用高精度定位</span>
                    </div>
                </div>
                
                <div class="input-container">
                    <label for="timeout">超时时间 (timeout) - 毫秒</label>
                    <input type="number" id="timeout" value="5000" min="0">
                </div>
                
                <div class="input-container">
                    <label for="maximumAge">位置缓存有效期 (maximumAge) - 毫秒</label>
                    <input type="number" id="maximumAge" value="0" min="0">
                </div>
            </div>
            
            <div class="status loading" id="loadingStatus">
                <span class="location-icon">⏳</span> 正在获取您的位置信息...
            </div>
            
            <button class="btn" id="getLocationBtn">
                获取当前位置
            </button>
        </div>
        
        <div class="card">
            <div class="result-title">📋 位置信息结果</div>
            <div class="result-container">
                <div class="result-content" id="result">
请点击"获取当前位置"按钮查看您的位置信息
                </div>
            </div>
        </div>
        
        <div class="explanation">
            <h3>参数说明</h3>
            
            <div class="param-info">
                <h4>enableHighAccuracy</h4>
                <p>此参数表示是否启用高精度定位模式。当设置为true时，设备可能会使用更多电量并花费更长时间来获取位置，但会返回更精确的结果。</p>
            </div>
            
            <div class="param-info">
                <h4>timeout</h4>
                <p>获取位置允许的最大时间（毫秒）。如果在指定时间内未获取到位置，将触发错误回调。</p>
            </div>
            
            <div class="param-info">
                <h4>maximumAge</h4>
                <p>可接受的最旧缓存位置的时间（毫秒）。设置为0表示必须获取新位置，不能使用缓存。</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const getLocationBtn = document.getElementById('getLocationBtn');
            const resultDiv = document.getElementById('result');
            const loadingStatus = document.getElementById('loadingStatus');
            
            getLocationBtn.addEventListener('click', function() {
                // 显示加载状态
                loadingStatus.style.display = 'flex';
                resultDiv.innerHTML = '';
                
                // 获取参数值
                const enableHighAccuracy = document.getElementById('enableHighAccuracy').checked;
                const timeout = parseInt(document.getElementById('timeout').value) || 5000;
                const maximumAge = parseInt(document.getElementById('maximumAge').value) || 0;
                
                // 创建选项对象
                const options = {
                    enableHighAccuracy: enableHighAccuracy,
                    timeout: timeout,
                    maximumAge: maximumAge
                };
                
                // 成功回调函数
                function success(pos) {
                    loadingStatus.style.display = 'none';
                    const crd = pos.coords;
                    
                    const output = `
<span class="success">✓ 成功获取位置信息：</span>
纬度：${crd.latitude}
经度：${crd.longitude}
海拔：${crd.altitude ? crd.altitude + '米' : '不可用'}
精度：${crd.accuracy}米
海拔精度：${crd.altitudeAccuracy ? crd.altitudeAccuracy + '米' : '不可用'}
方向：${crd.heading ? crd.heading + '°' : '不可用'}
速度：${crd.speed ? crd.speed + '米/秒' : '不可用'}
时间戳：${new Date(pos.timestamp).toLocaleString()}
                    `;
                    
                    resultDiv.innerHTML = output;
                }
                
                // 错误回调函数
                function error(err) {
                    loadingStatus.style.display = 'none';
                    
                    const errorMessages = {
                        1: 'PERMISSION_DENIED - 用户拒绝了位置请求',
                        2: 'POSITION_UNAVAILABLE - 无法获取位置信息',
                        3: 'TIMEOUT - 请求超时'
                    };
                    
                    resultDiv.innerHTML = `<span class="error">✗ 错误（${err.code}）：${errorMessages[err.code] || err.message}</span>`;
                }
                
                // 调用地理位置API
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(success, error, options);
                } else {
                    loadingStatus.style.display = 'none';
                    resultDiv.innerHTML = '<span class="error">✗ 错误：您的浏览器不支持地理位置服务</span>';
                }
            });
        });
    </script>
</body>
</html>
