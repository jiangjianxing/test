<!DOCTYPE html>
<html>
<head>
    <title>Cookie</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        button { margin: 5px; padding: 8px 15px; }
        pre { background: #f5f5f5; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Cookie</h2>
    
    <div>
        <button onclick="setLocalCookie()">1. 设置本地Cookie</button>
        <button onclick="showLocalCookie()">2. 查看本地Cookie</button>
    </div>

    <div style="margin-top: 20px;">
        <button onclick="setHttpbinCookie()">3. 设置在线 Cookie</button>
        <button onclick="showHttpbinCookie()">4. 查看在线 Cookie</button>
    </div>

    <pre id="result"></pre>

    <script>
        function setLocalCookie() {
            const expires = new Date(Date.now() + 60000);
            document.cookie = `local_test=Cookie_${Date.now()}; expires=${expires.toUTCString()}; path=/`;
            showLocalCookie();
        }

        function showLocalCookie() {
            const cookies = document.cookie;
            showResult(`当前本地Cookie内容：\n${cookies || '无Cookie'}`);
        }

        async function setHttpbinCookie() {
            const expires = new Date(Date.now() + 60000);
            try {
                await fetch(`https://httpbin.org/response-headers?Set-Cookie=httpbin_cookie=${Date.now()}; expires=${expires.toUTCString()}; SameSite=None; Secure;`, {
                    credentials: 'include',
                    mode: 'cors'
                });
                showHttpbinCookie();
            } catch (error) {
                showResult('设置失败：' + error.message);
            }
        }

        async function showHttpbinCookie() {
            try {
                const response = await fetch('https://httpbin.org/cookies', {
                    credentials: 'include',
                    mode: 'cors'
                });
                const cookies = (await response.json()).cookies.httpbin_cookie;
                showResult(`在线返回的Cookie：\n${cookies || '无Cookie'}`);
            } catch (error) {
                showResult('获取失败：' + error.message);
            }
        }

        function showResult(text) {
            document.getElementById('result').textContent = text;
        }
    </script>
</body>
</html>
