<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test location</title>
    <script>
    window.onload = () => {
        const button = document.createElement('button');
        button.innerText = "GetLocation";
        button.onclick = function() {
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementsByTagName('pre')[0].innerHTML += "Latitude: " + position.coords.latitude + ", Longitude: " + position.coords.longitude + "\n";
            })
        }
        document.body.append(button);
        document.body.append(document.createElement('pre'));
    }
    </script>
</head>
<body></body>
</html>
