
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JavaScript game controls</title>
    <style>* { padding: 0; margin: 0; word-wrap: break-word; } canvas { background: #013333 url(img/background.png) no-repeat; display: block; margin: 0 auto; } #output { text-align: center; margin-top: 30px; white-space: pre-wrap } </style>
    <script src="js/leap-0.6.4.min.js"></script>
    <style>
    .droptarget {
        float: left; 
        width: 100px; 
        height: 35px;
        margin: 15px;
        padding: 10px;
        border: 1px solid #aaaaaa;
    }
    </style>
</head>
<body>

<p>在两个矩形框中来回拖动 p 元素:</p>
<div class="droptarget" ondrop="drop(event)" ondragover="allowDrop(event)">
  <p ondragstart="dragStart(event)" ondragend="dragEnd(event)" draggable="true" id="dragtarget">拖动我!</p>
</div>
<div class="droptarget" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
<p id="demo"></p>

<canvas id="myCanvas" width="480" height="320"></canvas>

<script>
    // INIT
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");
    var playerHeight = 110;
    var playerWidth = 92;
    var playerX = (canvas.width - playerWidth) / 2;
    var playerY = (canvas.height - playerHeight) / 2;
    var rightPressed = false;
    var leftPressed = false;
    var upPressed = false;
    var downPressed = false;
    var img = new Image();
    img.src = "img/player.png";

    // KEYBOARD
    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);
    function keyDownHandler(e) {
        if ("code" in e) {
            switch(e.code) {
                case "Unidentified":
                    break;
                case "ArrowRight":
                case "Right": // IE <= 9 and FF <= 36
                case "KeyD":
                    rightPressed = true;
                    return;
                case "ArrowLeft":
                case "Left": // IE <= 9 and FF <= 36
                case "KeyA":
                    leftPressed = true;
                    return;
                case "ArrowUp":
                case "Up": // IE <= 9 and FF <= 36
                case "KeyW":
                    upPressed = true;
                    return;
                case "ArrowDown":
                case "Down": // IE <= 9 and FF <= 36
                case "KeyS":
                    downPressed = true;
                    return;
                default:
                    return;
            }
        }

        if(e.keyCode == 39) {
            rightPressed = true;
        }
        else if(e.keyCode == 37) {
            leftPressed = true;
        }
        if(e.keyCode == 40) {
            downPressed = true;
        }
        else if(e.keyCode == 38) {
            upPressed = true;
        }
    }
    function keyUpHandler(e) {
        if ("code" in e) {
            switch(e.code) {
                case "Unidentified":
                    break;
                case "ArrowRight":
                case "Right": // IE <= 9 and FF <= 36
                case "KeyD":
                    rightPressed = false;
                    return;
                case "ArrowLeft":
                case "Left": // IE <= 9 and FF <= 36
                case "KeyA":
                    leftPressed = false;
                    return;
                case "ArrowUp":
                case "Up": // IE <= 9 and FF <= 36
                case "KeyW":
                    upPressed = false;
                    return;
                case "ArrowDown":
                case "Down": // IE <= 9 and FF <= 36
                case "KeyS":
                    downPressed = false;
                    return;
                default:
                    return;
            }
        }

        if(e.keyCode == 39) {
            rightPressed = false;
        }
        else if(e.keyCode == 37) {
            leftPressed = false;
        }
        if(e.keyCode == 40) {
            downPressed = false;
        }
        else if(e.keyCode == 38) {
            upPressed = false;
        }
    }

    // MOUSE
    document.addEventListener("mousemove", mouseMoveHandler);
    function mouseMoveHandler(e) {
        playerX = e.pageX - canvas.offsetLeft - playerWidth / 2;
        playerY = e.pageY - canvas.offsetTop - playerHeight / 2;
        output.textContent = `Mouse:\nx: ${playerX}, y: ${playerY}`;
    }

    // TOUCH
    document.addEventListener("touchstart", (e) => touchHandler(e, "touchstart"));
    document.addEventListener("touchmove", (e) => touchHandler(e, "touchmove"));
    document.addEventListener("touchend", (e) => touchHandler(e, "touchend"));
    function touchHandler(e, t) {
        output.textContent = t;
        if(e.touches && t !== "touchend") {
            playerX = e.touches[0].pageX - canvas.offsetLeft - playerWidth / 2;
            playerY = e.touches[0].pageY - canvas.offsetTop - playerHeight / 2;
            output.textContent += `:\nx: ${playerX}, y: ${playerY}`;
            e.preventDefault();
        }
        function classToJson(instance) {
            const jsonObj = {};
            for (const key in instance) {
                if (typeof instance[key] !== 'function') {
                jsonObj[key] = instance[key];
                }
            }
            return JSON.stringify(jsonObj);
        }
        output.textContent += `\n\n${JSON.stringify(e,(_,v)=>typeof v==="object" ? Object.keys(Object.getPrototypeOf(v)).reduce((o,k)=>(o[k]=v[k],o),Object.assign({}, v ? Array.apply(null, v).map(classToJson) : {})):v)}`;
    }

    // GAMEPAD
    window.addEventListener("gamepadconnected", gamepadHandler);
    var controller = {};
    var buttonsPressed = [];
    function gamepadHandler(e) {
        controller = e.gamepad;
        output.textContent = `Gamepad: ${controller.id}`;
    }
    function gamepadUpdateHandler() {
        buttonsPressed = [];
        if(controller.buttons) {
            for(var b=0; b<controller.buttons.length; b++) {
                if(controller.buttons[b].pressed) {
                    buttonsPressed.push(b);
                }
            }
        }
    }
    function gamepadButtonPressedHandler(button) {
        var press = false;
        for(var i=0; i<buttonsPressed.length; i++) {
            if(buttonsPressed[i] == button) {
                press = true;
            }
        }
        return press;
    }

    // LEAP MOTION
    var toDegrees = 1 / (Math.PI / 180);
    var horizontalDegree = 0;
    var verticalDegree = 0;
    var degreeThreshold = 30;
    var grabStrength = 0;
    Leap.loop({
        hand: function(hand) {
            horizontalDegree = Math.round(hand.roll() * toDegrees);
            verticalDegree = Math.round(hand.pitch() * toDegrees);
            grabStrength = hand.grabStrength;
            output.textContent = `Leap Motion: \nroll: ${horizontalDegree}°\npitch: ${verticalDegree}°\nstrength: ${grabStrength}`;
        }
    });

    // DRAW
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // KEYBOARD
        if(rightPressed) {
            playerX += 5;
        }
        else if(leftPressed) {
            playerX -= 5;
        }
        if(downPressed) {
            playerY += 5;
        }
        else if(upPressed) {
            playerY -= 5;
        }

        // GAMEPAD
        gamepadUpdateHandler();
        if(gamepadButtonPressedHandler(0)) {
            playerY -= 5;
        }
        else if(gamepadButtonPressedHandler(1)) {
            playerY += 5;
        }
        if(gamepadButtonPressedHandler(2)) {
            playerX -= 5;
        }
        else if(gamepadButtonPressedHandler(3)) {
            playerX += 5;
        }
        if(gamepadButtonPressedHandler(11)) {
            alert('BOOM!');
        }

        // LEAP MOTION
        if(horizontalDegree > degreeThreshold) {
            playerX -= 5;
        }
        else if(horizontalDegree < -degreeThreshold) {
            playerX += 5;
        }
        if(verticalDegree > degreeThreshold) {
            playerY += 5;
        }
        else if(verticalDegree < -degreeThreshold) {
            playerY -= 5;
        }
        if(grabStrength == 1) {
            alert('BOOM!');
        }

        ctx.drawImage(img, playerX, playerY);
        requestAnimationFrame(draw);
    }
    draw();
</script>

<div id="output"></div>

<script>
function dragStart(event) {
    event.dataTransfer.setData("Text", event.target.id);
    document.getElementById("demo").innerHTML = "开始拖动 p 元素";
}
function dragEnd(event) {
    document.getElementById("demo").innerHTML = "完成 p 元素的拖动。";
}
function allowDrop(event) {
    event.preventDefault();
}
function drop(event) {
    event.preventDefault();
    var data = event.dataTransfer.getData("Text");
    event.target.appendChild(document.getElementById(data));
}
</script>

</body>
</html>
